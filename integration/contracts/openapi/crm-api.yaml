openapi: 3.1.0
info:
  title: Foundgine CRM API (supplied application surface)
  version: "1.0.0-baseline"
  description: >
    Baseline contract for routes documented by the supplied CRM README.
    This is not a claim that every domain operation or GraphQL feature is implemented.
servers:
  - url: http://localhost:5080
security:
  - bearerAuth: []
paths:
  /api/companies:
    get:
      summary: List tenant-scoped companies
      responses:
        "200": { description: Company collection }
    post:
      summary: Create a company in the authenticated tenant
      responses:
        "201": { description: Created company }
        "400": { description: Invalid request }
  /api/contacts:
    get:
      summary: List tenant-scoped contacts
      responses:
        "200": { description: Contact collection }
    post:
      summary: Create a contact in the authenticated tenant
      responses:
        "200": { description: Created contact }
        "400": { description: Invalid request }
  /api/opportunities:
    get:
      summary: List tenant-scoped opportunities
      responses:
        "200": { description: Opportunity collection }
    post:
      summary: Create an opportunity in the authenticated tenant
      responses:
        "200": { description: Created opportunity }
        "400": { description: Invalid request }
  /api/semantic/capabilities:
    get:
      summary: Discover authenticated semantic capabilities
      responses:
        "200": { description: Semantic capability catalog }
  /api/semantic/capability-contract:
    get:
      summary: Discover the policy-aware Foundgine capability contract
      responses:
        "200": { description: Capability contract }
  /graphql:
    post:
      summary: Execute the limited Foundgine-backed GraphQL query adapter
      description: >
        Supplied documentation describes scalar root-field queries only. Root arguments,
        nested relationship materialization and GraphQL mutations are not currently supported.
      responses:
        "200": { description: GraphQL response }
  /api/commercial-orders:
    get:
      summary: List the tenant's commercial orders (latest 100)
      responses:
        "200": { description: Commercial order collection }
    post:
      summary: Accept a commercial order and enqueue CommercialOrderAccepted atomically
      description: >
        Requires an Idempotency-Key header. Order and outbox row commit in one transaction.
        Same key + same body replays (200); same key + different body is 409.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, currency, lines]
              properties:
                companyId: { type: string, format: uuid }
                currency: { type: string, minLength: 3, maxLength: 3 }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, quantity, unitOfMeasure]
                    properties:
                      productId: { type: string, maxLength: 64 }
                      quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
                      unitOfMeasure: { type: string, maxLength: 16 }
      responses:
        "201": { description: Order accepted }
        "200": { description: Idempotent replay of an earlier request }
        "400": { description: Invalid request or company not in tenant }
        "409": { description: Idempotency-Key bound to a different request }
  /api/commercial-orders/{id}:
    get:
      summary: Get one commercial order in the authenticated tenant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Commercial order }
        "404": { description: Not found in this tenant }
  /api/integration/commercial-orders/{id}/fulfillment-confirmed:
    post:
      summary: Orchestration callback - ERP order created and inventory reserved
      description: Service identity only (realm role orchestration-service). Idempotent by body.idempotencyKey.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentCallback" }
      responses:
        "204": { description: Applied or replayed }
        "404": { description: No such order for (tenantId, id) }
        "409": { description: Conflicts with current order state or a prior command }
  /api/integration/commercial-orders/{id}/fulfillment-failed:
    post:
      summary: Orchestration callback - fulfillment rejected or failed and compensated
      description: Service identity only (realm role orchestration-service). Idempotent by body.idempotencyKey.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentCallback" }
      responses:
        "204": { description: Applied or replayed }
        "404": { description: No such order for (tenantId, id) }
        "409": { description: Conflicts with current order state or a prior command }
  /health:
    get:
      security: []
      summary: Health endpoint
      responses:
        "200": { description: Health status }
components:
  schemas:
    FulfillmentCallback:
      type: object
      required: [tenantId, crmCommercialOrderId, idempotencyKey]
      properties:
        tenantId: { type: string }
        crmCommercialOrderId: { type: string, format: uuid }
        externalId: { type: string, description: ERP reservation reference (confirmed) or ERP order id (failed) }
        reason: { type: string, maxLength: 1000 }
        idempotencyKey: { type: string, maxLength: 200 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
