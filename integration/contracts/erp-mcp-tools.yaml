contractStatus: baseline-from-supplied-source
transport:
  protocol: JSON-RPC 2.0
  endpoint: http://localhost:4783/mcp
  health: /health
tools:
  - name: foundgine_query
    purpose: Execute a semantic query through the ERP Foundgine pipeline
    arguments:
      intentJson: string
  - name: foundgine_mutation
    purpose: Execute a semantic mutation through the ERP Foundgine pipeline
    arguments:
      mutationJson: string
  - name: find_top_supplier_overdue_orders
    purpose: Resolve supplier/state ambiguity and return evidence-backed results
    arguments:
      actor: string
      state: string
domainMutations:
  - place_order
  - cancel_order
notes:
  - The tool names are based on the supplied AdvancedMcpServer source documentation.
  - The PostgreSQL mutation store is distinct from the in-memory fixture path.
  - Do not bypass the ERP mutation pipeline or write directly to ERP tables from CRM.
