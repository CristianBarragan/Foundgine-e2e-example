troke-width:0.5;" width="183.6758" x="52.5732" y="289.3516"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="163.6758" x="62.5732" y="310.9766">4. Start OrchestrationWorker</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="246.8223" x="21" y="343.8711"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="226.8223" x="31" y="365.4961">5. Seed ERP products + inventory (SQL)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="51.7539" y2="1129.1445"/><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="134.0234" x="351.7002" y="398.3906"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="114.0234" x="361.7002" y="420.0156">6. POST /customers</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="281.7793" x="277.8223" y="452.9102"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="261.7793" x="287.8223" y="474.5352">7. Watch CustomerOnboarding in Temporal UI</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="271.332" x="283.0459" y="507.4297"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="251.332" x="293.0459" y="529.0547">8. GET /customers/{id}/integration -&gt; Active</text><line style="stroke:#000000;stroke-width:1.5;" x1="271.8223" x2="271.8223" y1="51.7539" y2="1129.1445"/><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="140.8789" x="637.2686" y="561.9492"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="120.8789" x="647.2686" y="583.5742">9. Create opportunity</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="169.8887" x="622.7637" y="616.4688"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="149.8887" x="632.7637" y="638.0938">10. Create quote with lines</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="276.2129" x="569.6016" y="670.9883"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.2129" x="579.6016" y="692.6133">11. Submit (and approve as a different admin)</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="79.291" x="668.0625" y="725.5078"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="59.291" x="678.0625" y="747.1328">12. Accept</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="267.4883" x="573.9639" y="780.0273"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="247.4883" x="583.9639" y="801.6523">13. Watch QuoteToOrder; quote -&gt; Ordered</text><line style="stroke:#000000;stroke-width:1.5;" x1="563.6016" x2="563.6016" y1="51.7539" y2="1129.1445"/><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="292.9648" x="855.8145" y="834.5469"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="272.9648" x="865.8145" y="856.1719">14. Out of stock, price below floor, worker down</text><line style="stroke:#000000;stroke-width:1.5;" x1="849.8145" x2="849.8145" y1="51.7539" y2="1129.1445"/><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="187.4961" x="1198.4238" y="889.0664"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="167.4961" x="1208.4238" y="910.6914">15. POST /quotes/{id}/returns</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="196.3672" x="1193.9883" y="943.5859"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="176.3672" x="1203.9883" y="965.2109">16. Send goodsReceived signal</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="266.7852" x="1158.7793" y="998.1055"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="246.7852" x="1168.7793" y="1019.7305">17. Check stock restored; return Completed</text><line style="stroke:#000000;stroke-width:1.5;" x1="1152.7793" x2="1152.7793" y1="51.7539" y2="1129.1445"/><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="245.5859" x="1435.5645" y="1052.625"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="225.5859" x="1445.5645" y="1074.25">18. Reconcile, audit trail, outbox queries</text><ellipse cx="1558.3574" cy="1118.1445" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1558.3574" cy="1118.1445" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="1429.5645" x2="1429.5645" y1="51.7539" y2="1129.1445"/><line style="stroke:#000000;stroke-width:1.5;" x1="1685.1504" x2="1685.1504" y1="51.7539" y2="1129.1445"/><line style="stroke:#475569;stroke-width:1;" x1="144.4111" x2="144.4111" y1="91.2734" y2="111.2734"/><polygon fill="#475569" points="140.4111,101.2734,144.4111,111.2734,148.4111,101.2734,144.4111,105.2734" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="144.4111" x2="144.4111" y1="160.3125" y2="180.3125"/><polygon fill="#475569" points="140.4111,170.3125,144.4111,180.3125,148.4111,170.3125,144.4111,174.3125" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#47