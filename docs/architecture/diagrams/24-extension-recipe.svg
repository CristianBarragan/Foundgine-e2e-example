<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="897px" preserveAspectRatio="none" style="width:411px;height:897px;background:#FFFFFF;" version="1.1" viewBox="0 0 411 897" width="411px" zoomAndPan="magnify"><title>Recipe: adding a new cross-system flow</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="316.7578" x="45.8936" y="35.5">Recipe: adding a new cross-system flow</text></g><ellipse cx="205.7725" cy="60.3594" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F5F9" height="63.5586" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="328.9883" x="41.2783" y="90.3594"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="163.7754" x="51.2783" y="111.9844">1. Write the JSON Schema(s)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="195.2578" x="51.2783" y="126.5039">contracts/schemas/&lt;flow&gt;.v1.json</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="308.9883" x="51.2783" y="141.0234">(schemaVersion, tenantId, correlationId, business key)</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="280.9941" x="65.2754" y="173.918"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="190.4473" x="75.2754" y="195.543">2. CRM side: migration NNN_*.sql</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="260.9941" x="75.2754" y="210.0625">(state column + CHECK, unique business key)</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="303.957" x="53.7939" y="242.957"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="283.957" x="63.7939" y="264.582">3. CRM service: conditional UPDATE state change</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="244.7578" x="63.7939" y="279.1016">+ Outbox.Enqueue in the SAME transaction</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="331.5547" x="39.9951" y="311.9961"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="261.9961" x="49.9951" y="333.6211">4. Outbox: new type + IWorkflowStarter.Start*</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="311.5547" x="49.9951" y="348.1406">(workflow id &lt;Flow&gt;:&lt;tenant&gt;:&lt;key&gt;, RejectDuplicate)</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="337.8125" x="36.8662" y="381.0352"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="187.5879" x="46.8662" y="402.6602">5. ERP side: Flyway V&lt;N&gt;__*.sql,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="317.8125" x="46.8662" y="417.1797">service with ONE atomic transaction + inbox/unique key</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="351.2891" x="30.1279" y="450.0742"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="316.9219" x="40.1279" y="471.6992">6. ERP activity (queue erp), name 'erp.&lt;verb&gt;-&lt;noun&gt;';</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="331.2891" x="40.1279" y="486.2188">business refusals = non-retryable ApplicationFailure types</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="386.6738" x="12.4355" y="519.1133"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="366.6738" x="22.4355" y="540.7383">7. CRM activity (queue crm) 'crm.record-*' / 'crm.mark-*-failed':</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="206.6895" x="22.4355" y="555.2578">idempotent, conflict on a different id</text><rect fill="#F1F5F9" height="63.5586" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="389.5449" x="11" y="588.1523"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="202.2246" x="21" y="609.7773">8. Workflow in temporal/workflows:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="369.5449" x="21" y="624.2969">retry policy, do-not-retry list, compensation in a detached scope,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="77.625" x="21" y="638.8164">query 'status'</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="276.002" x="67.7715" y="671.7109"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.002" x="77.7715" y="693.3359">9. Register workflow in OrchestrationWorker,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="224.8594" x="77.7715" y="707.8555">activities in the ERP/CRM worker config</text><rect fill="#F1F5F9" height="49.0391" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="333.6348" x="38.9551" y="740.75"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="313.6348" x="48.9551" y="762.375">10. Tests: pure planner, service+DB, workflow test env,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="229.0898" x="48.9551" y="776.8945">CRM API test with fake IWorkflowStarter</text><rect fill="#F1F5F9" height="34.5195" rx="4" ry="4" style="stroke:#475569;stroke-width:0.5;" width="383.668" x="13.9385" y="809.7891"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="363.668" x="23.9385" y="831.4141">11. Docs: sequence diagram in diagrams/src, decisions.md entry</text><ellipse cx="205.7725" cy="875.3086" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="205.7725" cy="875.3086" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="70.3594" y2="90.3594"/><polygon fill="#475569" points="201.7725,80.3594,205.7725,90.3594,209.7725,80.3594,205.7725,84.3594" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="153.918" y2="173.918"/><polygon fill="#475569" points="201.7725,163.918,205.7725,173.918,209.7725,163.918,205.7725,167.918" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="222.957" y2="242.957"/><polygon fill="#475569" points="201.7725,232.957,205.7725,242.957,209.7725,232.957,205.7725,236.957" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="291.9961" y2="311.9961"/><polygon fill="#475569" points="201.7725,301.9961,205.7725,311.9961,209.7725,301.9961,205.7725,305.9961" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="361.0352" y2="381.0352"/><polygon fill="#475569" points="201.7725,371.0352,205.7725,381.0352,209.7725,371.0352,205.7725,375.0352" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="205.7725" x2="205.7725" y1="430.0742" y2="450.0742"/><polygon fill="#475569" points="201.7725,440.0742,205.7725,450.0742,209.7725,440.07