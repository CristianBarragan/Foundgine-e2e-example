ill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="221.3535" x="600.1396" y="293.7021">INSERT admin_audit (separate connection,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="119.8721" x="600.1396" y="307.0117">correlation id included)</text></g><g class="message" data-participant-1="api" data-participant-2="a"><polygon fill="#475569" points="49.999,334.9746,39.999,338.9746,49.999,342.9746,45.999,338.9746" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;" x1="43.999" x2="367.3872" y1="338.9746" y2="338.9746"/><text fill="#000000" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="7.1436" x="55.999" y="334.3213">6</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="87.4951" x="67.1426" y="334.3213">count re-queued</text></g><g class="message" data-participant-1="pub" data-participant-2="t"><polygon fill="#475569" points="1465.792,362.2842,1475.792,366.2842,1465.792,370.2842,1469.792,366.2842" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="1169.9312" x2="1471.792" y1="366.2842" y2="366.2842"/><text fill="#000000" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="6.397" x="1176.9312" y="361.6309">7</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="273.4639" x="1187.3281" y="361.6309">start CustomerOnboarding:&lt;tenant&gt;:&lt;id&gt;:&lt;attempt&gt;</text></g><path d="M1482,383.2842 L1482,428.2842 A4,4 0 0 0 1486,432.2842 L1748,432.2842 A4,4 0 0 0 1752,428.2842 L1752,389.2842 L1742,379.2842 L1486,379.2842 A4,4 0 0 0 1482,383.2842" fill="#FEF9C3" style="stroke:#CA8A04;stroke-width:0.5;"/><path d="M1742,379.2842 L1742,387.2842 A2,2 0 0 0 1744,389.2842 L1752,389.2842 L1742,379.2842" fill="#FEF9C3" style="