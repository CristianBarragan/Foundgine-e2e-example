name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FOUNDGINE_COMMIT: dd18ccf9fd05cca927cfb5224d415f9726727bae
  FOUNDGINE_VERSION: 3.3.6-ci.dd18ccf9fd05

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validation dependencies
        run: pip install jsonschema referencing

      - name: Validate shared contracts
        run: python3 scripts/validate-contracts.py

  crm:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Crm_dev_pw1!
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Crm_dev_pw1! -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 15s

    env:
      CRM_TEST_CONNECTION: Server=localhost,1433;Database=crm;User Id=sa;Password=Crm_dev_pw1!;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Check out the exact Foundgine revision used by this E2E run.
      - name: Checkout Foundgine
        uses: actions/checkout@v4
        with:
          repository: CristianBarragan/Foundgine
          ref: ${{ env.FOUNDGINE_COMMIT }}
          path: foundgine-src

      # Build the Foundgine NuGet packages into the local feed.
      - name: Pack Foundgine packages
        run: |
          bash scripts/pack-foundgine.sh foundgine-src "$FOUNDGINE_VERSION"

      # Restore and run the CRM tests against the locally packed packages.
      - name: Run CRM tests
        run: |
          dotnet test crm/Crm.slnx \
            -p:FoundgineVersion="$FOUNDGINE_VERSION" \
            --logger "trx" \
            --results-directory crm-results

      # DB-backed tests must execute rather than silently skip.
      - name: Reject skipped CRM tests
        run: python3 scripts/assert-no-skipped.py crm-results

  erp:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_dev_pw
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ERP_TEST_JDBC: jdbc:postgresql://localhost:5432/erp?user=erp&password=erp_dev_pw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      # Check out the exact same Foundgine revision used by CRM.
      - uses: actions/checkout@v4
        with:
          repository: CristianBarragan/Foundgine
          ref: ${{ env.FOUNDGINE_COMMIT }}
          path: foundgine-src

      # Build and install the Java artifacts into this runner's local Maven repository.
      # -am also builds the required reactor dependencies.
      # The revision property overrides the Java parent's default version.
      # GPG signing is disabled because this is a CI-local installation.
      - name: Build and install Foundgine Java modules
        run: |
          mvn -B \
            -f foundgine-src/src/java/pom.xml \
            -Drevision="$FOUNDGINE_VERSION" \
            -DskipTests \
            -Dgpg.skip=true \
            -pl foundgine-core,foundgine-providers \
            -am \
            install

      # Confirm the expected version was installed locally.
      - name: Verify installed Foundgine artifacts
        run: |
          VERSION="$FOUNDGINE_VERSION"

          test -f "$HOME/.m2/repository/io/github/cristianbarragan/foundgine-core/$VERSION/foundgine-core-$VERSION.jar"
          test -f "$HOME/.m2/repository/io/github/cristianbarragan/foundgine-providers/$VERSION/foundgine-providers-$VERSION.jar"

          echo "Foundgine Java artifacts installed:"
          echo "  foundgine-core:$VERSION"
          echo "  foundgine-providers:$VERSION"

      # Force ERP to resolve the same commit-derived version.
      - name: Run ERP integration tests
        run: |
          mvn -B \
            -f erp/pom.xml \
            -Dfoundgine.version="$FOUNDGINE_VERSION" \
            verify

      # Reject skipped tests.
      - name: Reject skipped ERP tests
        run: |
          python3 scripts/assert-no-skipped.py erp/target/surefire-reports

  orchestration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Temporal workflows
        run: mvn -B -f temporal/workflows/pom.xml verify

  infra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate base Docker Compose configuration
        run: |
          docker compose \
            --env-file .env \
            -f infrastructure/docker-compose.yml \
            config -q

      - name: Validate E2E Docker Compose configuration
        run: |
          docker compose \
            --env-file .env \
            -f infrastructure/docker-compose.yml \
            -f infrastructure/docker-compose.demo.yml \
            --profile e2e \
            config -q