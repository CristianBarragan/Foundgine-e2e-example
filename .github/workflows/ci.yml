name: ci
on: [push, pull_request]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema referencing
      - run: python3 scripts/validate-contracts.py

  crm:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Crm_dev_pw1!" }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Crm_dev_pw1! -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 15s
    env:
      # sa: OutboxRecoveryTests creates and drops its own database.
      CRM_TEST_CONNECTION: Server=localhost,1433;Database=crm;User Id=sa;Password=Crm_dev_pw1!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test crm/Crm.slnx --logger "trx" --results-directory crm-results
      # The DB-backed tests are [SkippableFact]: without the connection they skip and the run stays green. Not allowed here.
      - run: python3 scripts/assert-no-skipped.py crm-results

  erp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: erp, POSTGRES_USER: erp, POSTGRES_PASSWORD: erp_dev_pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ERP_TEST_JDBC: jdbc:postgresql://localhost:5432/erp?user=erp&password=erp_dev_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 27 }
      - run: mvn -B -f erp/pom.xml verify
      - run: python3 scripts/assert-no-skipped.py erp/target/surefire-reportsreports
      
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infrastructure/docker-compose.yml config -q
      - run: docker compose --env-file .env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.demo.yml --profile e2e config -q
