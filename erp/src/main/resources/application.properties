server.port=8082
spring.application.name=erp

# Database (compose erp-db). Flyway applies db/migration at startup.
spring.datasource.url=${ERP_DB_URL:jdbc:postgresql://localhost:5434/erp}
spring.datasource.username=${ERP_DB_USER:erp}
spring.datasource.password=${ERP_DB_PASSWORD:erp_dev_pw}

# JPA: Flyway owns the schema; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Temporal: ERP activities run in this process when enabled.
temporal.enabled=${TEMPORAL_ENABLED:false}
temporal.address=${TEMPORAL_ADDRESS:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:enterprise}
temporal.erp-task-queue=${TEMPORAL_ERP_TASK_QUEUE:erp}
temporal.orchestration-task-queue=${TEMPORAL_ORCHESTRATION_TASK_QUEUE:orchestration}
temporal.outbox-poll-ms=${TEMPORAL_OUTBOX_POLL_MS:1000}

# Keycloak resource server: issuer, signature, lifetime and audience are validated. The issuer is resolved lazily on the
# first token, so the ERP starts without Keycloak. Same realm and claim shape as the CRM (realm_access.roles, tenant_id).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8080/realms/enterprise}
spring.security.oauth2.resourceserver.jwt.audiences=erp-api

# Sales <-> fulfilment bots. rules = deterministic and offline (default); llm = LangChain4j against an OpenAI-compatible endpoint.
bots.mode=${BOTS_MODE:rules}
bots.llm.base-url=${BOTS_LLM_BASE_URL:https://api.openai.com/v1}
bots.llm.api-key=${BOTS_LLM_API_KEY:}
bots.llm.model=${BOTS_LLM_MODEL:gpt-4o-mini}

# MCP server (Streamable HTTP, read-only ERP tools) at /mcp. Off by default. Same bearer auth as the REST API.
mcp.enabled=${ERP_MCP_ENABLED:false}
mcp.allowed-origins=${ERP_MCP_ALLOWED_ORIGINS:}
